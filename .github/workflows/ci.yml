name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Core regression tests
        shell: cmd
        run: scripts\test.cmd
      - name: Build the app
        shell: cmd
        run: scripts\build.cmd
